[pytest]
testpaths =
    dcn/tests
    data/tests
    neuralrec/tests
    utils/tests
norecursedirs =
    old
    .git
    .pytest_cache
    .mypy_cache
    .ruff_cache
    .venv
    venv
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    training_e2e: miniature end-to-end model training, optionally isolated on one GPU
    slow_gpu: opt-in integration test requiring a dedicated real GPU
